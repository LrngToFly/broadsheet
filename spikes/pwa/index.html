<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Broadsheet — sign-in test</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Broadsheet">
  <meta name="theme-color" content="#1d2a44">
  <style>
    :root { color-scheme: light dark; font: 17px/1.45 -apple-system, system-ui, sans-serif; }
    body { margin: 0; padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem; max-width: 40rem; margin-inline: auto; }
    h1 { font-family: Georgia, serif; font-size: 1.7rem; margin: .5rem 0 0; }
    .sub { color: #888; margin: 0 0 1rem; }
    button { font: inherit; padding: .6rem 1rem; margin: .25rem .25rem .25rem 0; border-radius: 10px; border: 1px solid #8884; background: #1d2a44; color: #fff; }
    button.secondary { background: transparent; color: inherit; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
    dt { color: #888; } dd { margin: 0; word-break: break-word; }
    pre { background: #8881; padding: .75rem; border-radius: 8px; white-space: pre-wrap; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>The Broadsheet</h1>
  <p class="sub">Phase 0 sign-in test — no newsletter content here.</p>
  <dl id="status"></dl>
  <div id="actions"></div>
  <pre id="log"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
